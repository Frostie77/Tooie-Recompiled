name: Android APK

on:
  push:
    branches: [main, feature/android-touch-controls, test/android-turnip-loader, test/android-poco-touch-controls, feature/android-driver-picker]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gpu_driver_test:
        description: 'Build a separate GPU-driver and touch-controls test app'
        type: boolean
        default: false
      touch_controls_test:
        description: 'Build a separately named Debug playtest candidate (normal Debug also supports local signing)'
        type: boolean
        default: false
      prepare_candidate:
        description: 'Export an UNSIGNED release candidate (no installation or publication)'
        type: boolean
        default: false
      version_name:
        description: 'Candidate Android/native version'
        type: string
        default: '1.1.0'
      version_code:
        description: 'Candidate Android version code'
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      TOOIE_CI_ROOT: ${{ github.workspace }}/.ci-android
      TOOIE_ANDROID_TOUCH_TEST: ${{ (github.ref_name == 'feature/android-touch-controls' || github.head_ref == 'feature/android-touch-controls' || (github.event_name == 'workflow_dispatch' && inputs.touch_controls_test)) && '1' || '0' }}
      TOOIE_ANDROID_DRIVER_TEST: ${{ (github.ref_name == 'test/android-turnip-loader' || github.head_ref == 'test/android-turnip-loader' || github.ref_name == 'test/android-poco-touch-controls' || github.head_ref == 'test/android-poco-touch-controls' || (github.event_name == 'workflow_dispatch' && inputs.gpu_driver_test)) && '1' || '0' }}
    steps:
      - name: Check out the source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Dependencies are vendored in this repository, not git submodules.
          submodules: false

      - name: Select unsigned release candidate profile
        if: (env.TOOIE_ANDROID_TOUCH_TEST != '1' && env.TOOIE_ANDROID_DRIVER_TEST != '1' && github.ref_name == 'feature/android-driver-picker') || (github.event_name == 'workflow_dispatch' && inputs.prepare_candidate)
        env:
          CANDIDATE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_candidate && inputs.version_name || '1.1.0' }}
          CANDIDATE_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_candidate && inputs.version_code || '5' }}
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ['TOOIE_ANDROID_TOUCH_TEST'] != '0' or os.environ['TOOIE_ANDROID_DRIVER_TEST'] != '0':
              raise SystemExit('Test APKs cannot prepare a release candidate')
          version, code = os.environ['CANDIDATE_VERSION'], os.environ['CANDIDATE_CODE']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid candidate version')
          if not re.fullmatch(r'[1-9][0-9]*', code) or int(code) > 2100000000:
              raise SystemExit('Invalid candidate version code')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TOOIE_RELEASE_VERSION={version}\nTOOIE_RELEASE_VERSION_CODE={code}\n')
          PY

      - name: Install native build and host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake ninja-build pkg-config libsdl2-dev libzstd-dev python3 python3-pil curl unzip clang-18 lld-18 zip

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"

      - name: Set up Gradle 9.1.0 for AGP 9.0.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.1.0'
          cache-disabled: true

      - name: Prepare pinned Android dependencies and host shader tools
        run: bash tools/ci/build_android.sh prepare

      - name: Run Android host regressions
        env:
          CXX: g++
          TOOIE_JDK: ${{ env.JAVA_HOME }}
        run: |
          set -o pipefail
          mkdir -p .ci-android/logs
          {
            python3 tools/ci/test_verify_android.py
            python3 tools/android-workflow/tests/test_gpu_driver_staging.py
            python3 tools/android-workflow/tests/test_driver_recovery_check.py
            python3 tools/test_android_vulkan_driver.py --jni-include "$JAVA_HOME/include"
            python3 tools/test_android_driver_picker.py --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" --jni-include "$JAVA_HOME/include"
            python3 tools/test_android_startup_log.py --android-jar "$ANDROID_HOME/platforms/android-36/android.jar"
            python3 tools/test_touch_debug_preparation.py
            python3 tools/test_android_touch_controls.py --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" --jni-include "$JAVA_HOME/include"
            python3 tools/android-workflow/tests/test_workflow.py
            python3 tools/android-workflow/tests/test_terminal.py
            python3 tools/android-workflow/tests/test_collector.py
            python3 tools/android-workflow/tests/test_installed_capture.py
            python3 tools/test_transform_upload.py
            python3 tools/test_aiming_controls.py
            python3 tools/probe_dialogue_camera.py
            python3 tools/probe_dialogue_projection.py --opaque-window-types
            python3 tools/probe_deformed_vertices.py
            python3 tools/probe_deformed_vertices.py --seams
            python3 tools/probe_deformed_vertices.py --scene-trace
            python3 tools/test_android_release.py
            python3 tools/test_update_metadata.py
            python3 tools/test_android_updates.py --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" --jni-include "$JAVA_HOME/include"
            python3 tools/test_save_transfer.py --jni-include "$JAVA_HOME/include" --require-jni
            bash tools/test_audio_runtime.sh
            bash tools/test_android_surface_lifecycle.sh
            bash tools/test_android_rom_picker.sh
            python3 tools/test_android_mod_support.py --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" --jni-include "$JAVA_HOME/include"
            python3 tools/test_mod_runtime.py --build-dir .ci-android/mod-runtime --mod-output .ci-android/mod-check --clang clang-18 --linker ld.lld-18
            bash tools/test_android_vulkan_clear.sh
            bash tools/test_android_vulkan_descriptors.sh
          } 2>&1 | tee .ci-android/logs/host-tests.log
          mkdir -p .ci-android/artifacts
          cp .ci-android/mod-check/tooie_mod_check.nrm .ci-android/mod-check/tooie_mod_check-build-report.json .ci-android/artifacts/

      - name: Compile the Android ARM64 runtime
        run: bash tools/ci/build_android.sh native

      - name: Assemble and verify the APK
        run: bash tools/ci/build_android.sh package

      - name: Check release packaging with an ephemeral test certificate
        if: env.TOOIE_ANDROID_TOUCH_TEST != '1' && env.TOOIE_ANDROID_DRIVER_TEST != '1'
        run: |
          python3 tools/test_android_release.py \
            --integration-work .ci-android \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Check Debug local signing with an ephemeral test certificate
        if: env.TOOIE_ANDROID_DRIVER_TEST != '1'
        run: |
          python3 tools/test_touch_debug_preparation.py \
            --integration-work .ci-android \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Upload verified Android APK and build report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tooie-Recompiled-Android-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci-android/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare the requested unsigned candidate
        if: env.TOOIE_RELEASE_VERSION != '' && env.TOOIE_ANDROID_TOUCH_TEST != '1' && env.TOOIE_ANDROID_DRIVER_TEST != '1'
        run: bash tools/ci/build_android.sh candidate

      - name: Upload unsigned candidate and local signing helpers
        if: env.TOOIE_RELEASE_VERSION != '' && env.TOOIE_ANDROID_TOUCH_TEST != '1' && env.TOOIE_ANDROID_DRIVER_TEST != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tooie-Android-Unsigned-Candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci-android/candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-build-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .ci-android/logs/
            .ci-android/native/CMakeCache.txt
            .ci-android/native/compile_commands.json
          if-no-files-found: warn
          retention-days: 14
