plugins {
    id 'com.android.application'
}

// Development builds keep their existing identity. Release preparation supplies
// both values explicitly; neither a signing key nor a password belongs here.
def tooieVersionCode = providers.gradleProperty('tooieVersionCode').getOrElse('1')
if (!(tooieVersionCode ==~ /[1-9][0-9]*/) ||
        new BigInteger(tooieVersionCode) > 2100000000) {
    throw new GradleException('tooieVersionCode must be an integer from 1 to 2100000000')
}
def tooieVersionName = providers.gradleProperty('tooieVersionName').getOrElse('0.1.0-android')
def tooieDriverTestId = providers.gradleProperty('tooieDriverTestId').orNull
if (tooieDriverTestId != null && !(tooieDriverTestId ==~ /[0-9a-f]{12}/)) {
    throw new GradleException('tooieDriverTestId must be the 12-character source commit prefix')
}
if (!(tooieVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?/)) {
    throw new GradleException('tooieVersionName must be a semantic version')
}

android {
    namespace 'io.github.banjotooierecompiled'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.banjotooierecompiled'
        minSdk 24
        if (tooieDriverTestId != null) {
            minSdk 28
        }
        targetSdk 35
        versionCode tooieVersionCode.toInteger()
        versionName tooieVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            if (tooieDriverTestId != null) {
                applicationIdSuffix ".gputest.g${tooieDriverTestId}"
                manifestPlaceholders = [tooieDriverTestLabel: "Tooie GPU Test ${tooieDriverTestId}"]
            }
        }
        release {
            // Keep the established debug app and its private data installed.
            // The Java namespace/JNI activity stays unchanged.
            applicationIdSuffix '.release'
            debuggable false
            minifyEnabled false
            // Deliberately unsigned. Signing happens locally with the chosen,
            // protected release key, after the package has been reviewed.
        }
    }

    sourceSets {
        debug {
            if (tooieDriverTestId != null) {
                manifest.srcFile 'src/driver-test/AndroidManifest.xml'
            }
        }
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
